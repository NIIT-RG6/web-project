<!DOCTYPE html>
<html>

<head>
    <!-- Voylio: Import Vuetify CSS for styling components -->
    <link href="../src/assets/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="../src/assets/css/vuetify.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../src/assets/css/Forgot.css">
    <!-- Voylio: Set the viewport for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui">
    <title>Forgot Password</title>
</head>

<body>

    <div id="app">
        <!-- Voylio: Root component for the Vue application -->

        <v-app>
            <v-container fluid>
                <v-row align="center" justify="center">
                    <v-col cols="8" sm="6" md="4">
                        <v-card elevation="0">
                            <v-card-title class="text-center">
                                <!-- Voylio: Title for the forgot password section -->
                                <h2 style="width: 100%;">Forgot Password</h2>
                            </v-card-title>
                            <v-card-text>
                                <!-- Voylio: Form for user to submit their email and new password -->
                                <v-form ref="registerForm" v-model="valid" lazy-validation>
                                    <v-text-field label="Email" required type="email" :rules="emailRules"
                                        v-model="userDetails.email" outlined></v-text-field>
                                    <div class="code">
                                        <v-text-field label="Verification Code" required :rules="code"
                                            v-model="userDetails.code" outlined></v-text-field>
                                        <!-- Voylio: Button to send the verification code -->
                                        <button class="code-btn">Send Verification Code</button>
                                    </div>
                                    <v-text-field label="New Password" type="password" required :rules="passwordRules"
                                        v-model="userDetails.password" outlined></v-text-field>
                                    <v-text-field label="Confirm New Password" type="password" required
                                        :rules="confirmPasswordRules" v-model="userDetails.confirmPassword"
                                        outlined></v-text-field>

                                </v-form>
                            </v-card-text>
                            <v-card-text>
                                <!-- Voylio: Button to confirm the password reset process -->
                                <v-btn color="primary" :disabled="!valid" @click="submitRegistration"
                                    style="width: 100%;">Confirm</v-btn>
                            </v-card-text>
                        </v-card>
                    </v-col>
                </v-row>
            </v-container>

        </v-app>
    </div>

    <!-- Voylio: Import Vue and Vuetify JavaScript libraries -->
    <script src="../src/assets/js/vue.js"></script>
    <script src="../src/assets/js/vuetify.js"></script>
    <!-- Voylio: Import the custom JavaScript file for handling the forgot password logic -->
    <script src="../src/assets/js/Forgot.js"></script>

</body>

</html>
